<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kevin André Hughes — K2 Strategy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C8973A;
    --gold-light: #e0aa44;
    --black: #080808;
    --white: #F4EFE8;
    --muted: rgba(244,239,232,0.55);
    --border: rgba(200,151,58,0.25);
  }

  html, body {
    min-height: 100vh;
    background: var(--black);
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    overflow-x: hidden;
  }

  /* Mountain background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 50% 100%, rgba(200,151,58,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 0%, rgba(200,151,58,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 64px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeUp 0.8s ease both;
  }

  .logo-img {
    height: 80px;
    width: auto;
    margin-bottom: 20px;
    opacity: 0.92;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--white);
    margin-bottom: 4px;
  }

  .title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  .divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto;
  }

  /* Links */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 48px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: rgba(244,239,232,0.04);
    border: 0.5px solid var(--border);
    text-decoration: none;
    color: var(--white);
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.8s ease both;
  }

  .link-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--gold);
    transform: scaleY(0);
    transition: transform 0.25s ease;
  }

  .link-card:hover {
    background: rgba(200,151,58,0.08);
    border-color: rgba(200,151,58,0.5);
    transform: translateX(4px);
  }

  .link-card:hover::before {
    transform: scaleY(1);
  }

  .link-card.disabled {
    opacity: 0.45;
    cursor: default;
    pointer-events: none;
  }

  .link-icon {
    width: 36px;
    height: 36px;
    border: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
  }

  .link-content {
    flex: 1;
  }

  .link-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 2px;
  }

  .link-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--white);
    letter-spacing: 0.03em;
  }

  .link-arrow {
    font-size: 16px;
    color: var(--gold);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    transform: translateX(-4px);
  }

  .link-card:hover .link-arrow {
    opacity: 1;
    transform: translateX(0);
  }

  /* Badge bientôt */
  .badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    border: 0.5px solid var(--border);
    padding: 3px 8px;
    flex-shrink: 0;
  }

  /* Animation delays */
  .link-card:nth-child(1) { animation-delay: 0.1s; }
  .link-card:nth-child(2) { animation-delay: 0.2s; }
  .link-card:nth-child(3) { animation-delay: 0.3s; }
  .link-card:nth-child(4) { animation-delay: 0.4s; }

  /* Footer */
  .footer {
    text-align: center;
    animation: fadeUp 0.8s 0.5s ease both;
  }

  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .tagline span {
    color: var(--gold);
  }

  .contact {
    margin-top: 16px;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .contact a {
    color: var(--gold);
    text-decoration: none;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 400px) {
    .name { font-size: 22px; }
    .link-title { font-size: 16px; }
  }
</style>
</head>
